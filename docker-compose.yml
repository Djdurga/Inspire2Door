services:
  api:
    build: ./api
    environment:
      MERCHANT_IMPORT_TOKEN: ${MERCHANT_IMPORT_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./api/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy